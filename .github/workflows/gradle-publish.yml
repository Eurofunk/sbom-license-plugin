# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Gradle Package

on:
  release:
    types: [ created ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OSSRH_TOKEN_USERNAME: ${{ secrets.OSSRH_TOKEN_USERNAME }}
      OSSRH_TOKEN_PASSWORD: ${{ secrets.OSSRH_TOKEN_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Configure Gradle publishing credentials
        run: |
          mkdir -p "$HOME/.gradle"

          is_hex_key_id() {
            [[ "$1" =~ ^(0[xX])?[0-9A-Fa-f]{8,40}$ ]]
          }

          {
            echo "ossrhTokenUsername=${OSSRH_TOKEN_USERNAME}"
            echo "ossrhTokenPassword=${OSSRH_TOKEN_PASSWORD}"
            if [[ -n "${SIGNING_KEY_ID}" && is_hex_key_id "${SIGNING_KEY_ID}" ]]; then
              echo "signingKeyId=${SIGNING_KEY_ID}"
            else
              echo "Skipping signingKeyId because it is empty or not a hexadecimal key identifier." >&2
            fi
            echo "signingPassword=${SIGNING_PASSWORD}"
            echo "signingKey=${SIGNING_KEY}"
          } > "$HOME/.gradle/gradle.properties"

          chmod 600 "$HOME/.gradle/gradle.properties"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to Sonatype OSSRH
        run: ./gradlew publish

      - name: Publish to Gradle Plugin Portal
        run: ./gradlew publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Clean up Gradle credentials
        if: always()
        run: rm -f "$HOME/.gradle/gradle.properties"
