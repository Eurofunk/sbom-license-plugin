# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Gradle Package

on:
  release:
    types: [ created ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Extract version from release
        id: extract_version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build with Gradle
        run: ./gradlew build -Pversion=${{ env.RELEASE_VERSION }} --no-configuration-cache

      - name: Publish to Staging Repository
        run: ./gradlew publishAllPublicationsToStagingRepository -Pversion=${{ env.RELEASE_VERSION }} --no-configuration-cache

      - name: Release via JReleaser
        # gradle cache is broken, enable it when https://github.com/jreleaser/jreleaser/issues/1992 fixed
        run: ./gradlew jreleaserFullRelease -Pversion=${{ env.RELEASE_VERSION }} --no-configuration-cache --stacktrace
        env:
          # GitHub token for creating the release
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Sonatype Credentials
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

          # GPG Credentials
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Gradle Plugin Portal
        run: ./gradlew publishPlugins -Pversion=${{ env.RELEASE_VERSION }} --no-configuration-cache
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET  }}
          SIGNING_KEY: ${{ secrets.GPG_SECRET_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
