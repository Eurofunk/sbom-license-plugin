[versions]
jackson = "2.19.0"
junit-jupiter = "6.0.2"
jreleaser = "1.23.0"


[libraries]
classgraph = { module = "io.github.classgraph:classgraph", version = "4.8.179" }
cyclonedx-java = { module = "org.cyclonedx:cyclonedx-core-java", version = "12.1.0" }
equalsverifier = { module = "nl.jqno.equalsverifier:equalsverifier", version = "4.0" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
spdx-utils = { module = "org.ossreviewtoolkit.utils:spdx-utils", version = "79.0.0" }

[bundles]
jackson = ["jackson-annotations", "jackson-databind"]

[plugins]
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
publish-plugin = { id = "com.gradle.plugin-publish", version = "1.3.1" }
